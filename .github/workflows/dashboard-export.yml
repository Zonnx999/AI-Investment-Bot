name: Dashboard Export

# 하루 1회(평일, GitHub 예약 cron 이라 수 시간 지연 가능 — 시간 민감 작업 아님).
# Turso 에서 읽어 dashboard/*.json 갱신 → GitHub Pages. 운영 DB 는 '읽기만'(QUANT_BOT_CACHE=off).
on:
  schedule:
    - cron: "30 0 * * 1-5"
  workflow_dispatch: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install (locked)
        run: |
          pip install -r requirements.lock
          pip install --no-deps -e .

      # (삭제) actions/cache 로 data/ 레플리카+사이드카를 복원하던 단계 — 실패 시 낡은 스냅샷이
      # 영구 복원되는 자기강화 루프였음 (OPS-01, CLAUDE.md §4.10 #9). 매 실행 콜드 pull.
      - name: Export dashboard JSON
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          QUANT_BOT_DB_PATH: ${{ runner.temp }}/ci_replica.db
          QUANT_BOT_SYNC_TIMEOUT: "300"
          QUANT_BOT_CACHE: "off"
          QUANT_BOT_LOG_DIR: ${{ runner.temp }}/logs
        run: python scripts/export_dashboard.py

      - name: Commit dashboard JSON files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dashboard/kr_data.json dashboard/us_data.json dashboard/crypto_data.json dashboard/regime_data.json dashboard/predictions_data.json
          git diff --staged --quiet || git commit -m "chore: update dashboard data [skip ci]"
          git push

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload dashboard artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
